  <style>

    .sky {

      background: radial-gradient(circle at 50% 50%, rgba(231,163,90,0.16) 0%, transparent 34%, #050408 100%);

    .sky.scale-box { background: radial-gradient(ellipse at 50% 70%, #1c1510 0%, #070508 72%); }
    .sky.warping-in { animation: warpIn 0.45s ease-in; }
    .sky.warping-out { animation: warpOut 0.45s ease-in; }
    @keyframes warpIn {
      0% { filter: blur(0); transform: scale(1); opacity: 1; }
      45% { filter: blur(4px); transform: scale(1.03); opacity: 0.78; }
      100% { filter: blur(0); transform: scale(1); opacity: 1; }
    }
    @keyframes warpOut {
      0% { filter: blur(0); transform: scale(1); opacity: 1; }
      45% { filter: blur(4px); transform: scale(0.98); opacity: 0.78; }
      100% { filter: blur(0); transform: scale(1); opacity: 1; }

    .sky::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, transparent 58%, rgba(5, 4, 8, 0.82) 100%);
      pointer-events: none;
      z-index: 1;
    }
    .sky::after {
      content: "";
      position: absolute;
      inset: -8%;
      pointer-events: none;
      z-index: 0;
      opacity: 1;
      animation: starDrift 96s linear infinite;
      background-image:
        radial-gradient(1px 1px at 8% 14%, #f3eadc 50%, transparent 51%),
        radial-gradient(1px 1px at 22% 38%, #f3eadc 50%, transparent 51%),
        radial-gradient(1.5px 1.5px at 41% 11%, #f3eadc 50%, transparent 51%),
        radial-gradient(1px 1px at 63% 22%, #f3eadc 50%, transparent 51%),
        radial-gradient(1px 1px at 81% 9%, #f3eadc 50%, transparent 51%),
        radial-gradient(1px 1px at 91% 41%, #f3eadc 50%, transparent 51%),
        radial-gradient(1.5px 1.5px at 14% 62%, #f3eadc 50%, transparent 51%),
        radial-gradient(1px 1px at 33% 71%, #f3eadc 50%, transparent 51%),
        radial-gradient(1px 1px at 52% 58%, #f3eadc 50%, transparent 51%),
        radial-gradient(1px 1px at 74% 66%, #f3eadc 50%, transparent 51%),
        radial-gradient(1.5px 1.5px at 88% 78%, #f3eadc 50%, transparent 51%),
        radial-gradient(1px 1px at 6% 84%, #f3eadc 50%, transparent 51%),
        radial-gradient(1px 1px at 47% 88%, #f3eadc 50%, transparent 51%),
        radial-gradient(1px 1px at 69% 91%, #f3eadc 50%, transparent 51%),
        radial-gradient(1px 1px at 18% 48%, #f3eadc 50%, transparent 51%),
        radial-gradient(1px 1px at 58% 34%, #f3eadc 50%, transparent 51%),
        radial-gradient(1.5px 1.5px at 77% 51%, #f3eadc 50%, transparent 51%),
        radial-gradient(1px 1px at 95% 63%, #f3eadc 50%, transparent 51%),
        radial-gradient(1px 1px at 37% 24%, #f3eadc 50%, transparent 51%),
        radial-gradient(1px 1px at 4% 31%, #f3eadc 50%, transparent 51%);
    }
    .sky.scale-galaxy::after, .sky.scale-star::after, .sky.scale-ticket::after, .sky.scale-box::after, .sky.scale-planet::after { opacity: 1; }
    @keyframes starDrift {
      from { transform: translate3d(0, 0, 0); }
      to { transform: translate3d(-5%, -4%, 0); }
    }
    .rings, .kepler {
      position: absolute;
      inset: 6% 4%;

      height: 88%;
      pointer-events: none;
      z-index: 1;
    }
    .rings ellipse, .kepler ellipse {

      stroke: rgba(236, 222, 192, 0.42);
      stroke-width: 1.05px;
      vector-effect: non-scaling-stroke;
      stroke-dasharray: 0 2.8 0 7.1 0 1.6 0 11.4 0 4.2 0 6.6 0 2.1 0 9.3 0 3.4;
      stroke-linecap: round;
      animation: wellDrift 48s linear infinite;
    }
    .kepler ellipse.grit {
      stroke: rgba(243, 234, 220, 0.26);
      stroke-width: 0.55px;
      stroke-dasharray: 0 1.4 0 4.8 0 0.9 0 6.6 0 2.2 0 5.1 0 1.1 0 8.4 0 3.3;
      animation-duration: 31s;
      animation-direction: reverse;
    }
    .kepler ellipse.dust {
      stroke: rgba(198, 176, 148, 0.2);
      stroke-width: 0.45px;
      stroke-dasharray: 0 5.6 0 12.8 0 3.2 0 9.4 0 16.2 0 7.1;
      animation-duration: 67s;
    }
    .kepler .moons {
      stroke: rgba(231, 163, 90, 0.32);
      animation-duration: 40s;
      animation-direction: reverse;
    }
    @keyframes wellDrift {
      to { stroke-dashoffset: -56; }
    }
    .web {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }
    .web path {
      fill: none;
      stroke: rgba(231, 163, 90, 0.16);
      stroke-width: 0.5px;
      vector-effect: non-scaling-stroke;
      stroke-dasharray: 1.6 8 0.55 11;
      stroke-linecap: butt;
      animation: wellDrift 80s linear infinite;
    }
    .dust-sheet {
      position: absolute;
      inset: -28%;
      pointer-events: none;
      z-index: 1;
      opacity: 0.14;
      background-image:
        radial-gradient(circle, rgba(210,228,255,0.35) 0.55px, transparent 1px),
        radial-gradient(circle, rgba(255,220,170,0.18) 0.4px, transparent 0.85px);
      background-size: 263px 211px, 191px 167px;
    }
    .sky-spark {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 2;
    }
    .sky-spark i {
      position: absolute;
      width: 2.5px;
      height: 2.5px;
      border-radius: 50%;
      background: #e6ecf5;
      opacity: 0.65;
    }
    .sky-spark i.dim {
      width: 1.25px;
      height: 1.25px;
      background: #c5d4e8;
      animation: glowSoft 8.25s ease-in-out infinite;
    }
    .sky-spark i.spark {
      background: #f7f4ee;
      box-shadow: 0 0 9px rgba(236, 240, 250, 0.92);
      animation: twinkle 2.85s ease-in-out infinite;
    }
    .sky-spark i.warm {
      background: #f0e2c8;
      width: 2.5px;
      height: 2.5px;
      box-shadow: 0 0 7.5px rgba(240, 220, 190, 0.75);
      animation: glowSoft 6.75s ease-in-out infinite;
    }
    .sky-spark i.dying {
      background: #dce6f4;
      animation: dieOff 19.5s ease-in-out infinite;
    }
    .sky-spark i.soft {
      background: #e4eaf4;
      animation: glowSoft 6.4s ease-in-out infinite;
    }
    .sky-spark i.diamond {
      display: none;
      width: 3px;
      height: 3px;
      border-radius: 0;
      background: #e8dff4;
      box-shadow: 0 0 4px rgba(200, 180, 230, 0.45);
      transform: rotate(45deg);
      opacity: 0.55;
      animation: diamondTwinkle 3.15s ease-in-out infinite;
    }
    html.alt-universe .sky-spark i.diamond { display: block; }
    .sky-spark i.spark.shift {
      animation: twinkle 2.85s ease-in-out infinite, hueTwinkle 3.9s ease-in-out infinite;
    }
    .sky-spark i.dim.shift,
    .sky-spark i.soft.shift,
    .sky-spark i.warm.shift {
      animation: glowSoft 6.75s ease-in-out infinite, hueTwinkle 4.8s ease-in-out infinite;
    }
    .sky-spark i.dying.shift {
      animation: dieOff 19.5s ease-in-out infinite, hueTwinkle 6s ease-in-out infinite;
    }
    .sky-spark i.diamond.shift {
      animation: diamondTwinkle 3.15s ease-in-out infinite, hueTwinkle 4.2s ease-in-out infinite;
    }
    html.alt-universe .sky-spark i.diamond.shift {
      animation: diamondHue 3.15s ease-in-out infinite;
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.1; transform: scale(0.62); }
      47% { opacity: 0.58; }
      51% { opacity: 1; transform: scale(1.72); }
      56% { opacity: 0.24; transform: scale(0.78); }
    }
    @keyframes diamondTwinkle {
      0%, 100% { opacity: 0.16; transform: rotate(45deg) scale(0.7); }
      48% { opacity: 0.82; transform: rotate(45deg) scale(1.28); }
      54% { opacity: 1; transform: rotate(45deg) scale(1.6); }
      62% { opacity: 0.3; transform: rotate(45deg) scale(0.82); }
    }
    @keyframes hueTwinkle {
      0%, 100% { background: #e6ecf5; box-shadow: 0 0 5px rgba(230, 236, 245, 0.5); }
      33% { background: #ffd8a8; box-shadow: 0 0 8px rgba(255, 216, 168, 0.62); }
      66% { background: #94c6ff; box-shadow: 0 0 8px rgba(148, 198, 255, 0.6); }
    }
    @keyframes diamondHue {
      0%, 100% { background: #e8dff4; box-shadow: 0 0 4px rgba(200, 180, 230, 0.45); transform: rotate(45deg) scale(0.8); }
      50% { background: #d4b8ea; box-shadow: 0 0 7px rgba(170, 130, 220, 0.5); transform: rotate(45deg) scale(1.2); }
    }
    html.alt-universe .sky.scale-engine,
    html.alt-universe .sky.scale-lab,
    html.alt-universe .sky.scale-universe:has(.orch) {
      background:
        linear-gradient(rgba(92, 48, 140, 0.2), rgba(92, 48, 140, 0.2)),
        radial-gradient(ellipse at 22% 58%, #1a1410 0%, transparent 42%),
        radial-gradient(ellipse at 78% 38%, #121820 0%, #05060a 62%);

    /* Parallel universe sky: ~40% more active than current */
    html.alt-universe .sf-layer b.sf-live {
      animation-duration: 4.4s !important;
    }
    html.alt-universe .sf-layer b.sf-live.field-hue {
      animation-duration: 4.4s, 6s !important;
    }
    html.alt-universe .sky-spark i.spark {
      animation-duration: 2s !important;
    }
    html.alt-universe .sky-spark i.spark.shift {
      animation-duration: 2s, 2.8s !important;
    }
    html.alt-universe .sky-spark i.dim,
    html.alt-universe .sky-spark i.soft,

      animation-duration: 4.8s !important;
    }
    html.alt-universe .sky-spark i.dim.shift,
    html.alt-universe .sky-spark i.soft.shift,

    html.alt-universe .sky-spark i.diamond {
      animation-duration: 2.25s !important;
    }
    html.alt-universe .sky-spark i.diamond.shift {
      animation-duration: 2.25s !important;
    }
    .sf-burst {
      display: none;
      position: absolute;
      width: 6px;
      height: 6px;
      margin: -3px 0 0 -3px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 2;
      background: radial-gradient(circle, #fffef8 0%, #e0c4ff 28%, rgba(160, 110, 220, 0.35) 48%, transparent 70%);
      opacity: 0;
    }
    html.alt-universe .sf-burst {
      display: block;
    }
    .sf-burst.explode {
      animation: sfExplode 11s linear infinite;
    }
    .sf-burst.split {
      background: radial-gradient(circle, #f8f4ff 0%, #c4a8f0 35%, transparent 70%);
      animation: sfSplitFlash 14s linear infinite;
    }
    .sf-burst.split i {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 3px;
      height: 3px;
      margin: -1.5px 0 0 -1.5px;
      border-radius: 50%;
      background: #e8dff4;
      box-shadow: 0 0 6px rgba(200, 160, 240, 0.85);
      opacity: 0;
      animation: sfShard 14s linear infinite;
    }
    .sf-burst.split i:nth-child(1) { --dx: 0px; --dy: -28px; }
    .sf-burst.split i:nth-child(2) { --dx: 24px; --dy: 16px; animation-delay: inherit; }
    .sf-burst.split i:nth-child(3) { --dx: -24px; --dy: 16px; }
    @keyframes sfExplode {
      0%, 72%, 100% { opacity: 0; transform: scale(0.2); filter: blur(0); }
      74% { opacity: 1; transform: scale(1.4); }
      82% { opacity: 0.55; transform: scale(12); filter: blur(0.6px); }
      90% { opacity: 0; transform: scale(20); filter: blur(1.2px); }
    }
    @keyframes sfSplitFlash {

      70% { opacity: 1; transform: scale(1.8); }
      74% { opacity: 0.35; transform: scale(0.6); }

    @keyframes sfShard {
      0%, 72%, 100% { opacity: 0; transform: translate(0, 0) scale(0.4); }
      74% { opacity: 1; transform: translate(0, 0) scale(1); }
      86% { opacity: 0.7; transform: translate(var(--dx), var(--dy)) scale(0.75); }

      `;
      document.querySelectorAll("#brief [data-enter]").forEach((b) => b.addEventListener("click", () => enterChild(b.dataset.enter, b)));
      document.querySelectorAll("#brief [data-go]").forEach((b) => b.addEventListener("click", () => goTo(b.dataset.go)));
      document.querySelectorAll("#brief [data-issue]").forEach((b) => b.addEventListener("click", () => enterIssue(b.dataset.issue)));
      document.querySelectorAll("#brief [data-rock]").forEach((b) => b.addEventListener("click", () => enterRock(b.dataset.rock)));
      }
      renderGoneInto();
      notePlace();
    }

    function renderGoneInto() {
      const root = document.getElementById("gone");
      const current = lookupIssue(HOME_GATE.issueId);
      const featuredIds = new Set(current ? [String(current.id)] : []);
      const rest = goneIntoTickets().filter((iss) => !featuredIds.has(String(iss.id)));
      const onId = state.watching ? state.watching.id : state.selectedIssue;
      const showSteps = !!state.showAirSteps;
      const card = (iss, head, ghost) => {
        const title = head || issueLabel(iss) || iss.title || "";
        const blurb = iss.see || "";
        const tix = iss.url
          ? `<a class="gone-tix" href="${escapeHtml(iss.url)}" target="_blank" rel="noopener noreferrer" tabindex="-1">${escapeHtml(issueTag(iss))}</a>`
          : `<span class="gone-tix">${escapeHtml(issueTag(iss))}</span>`;
        const body = `<b>${escapeHtml(title)}</b>
            ${blurb ? `<span class="gone-blurb">${escapeHtml(blurb)}</span>` : ""}
            ${tix}`;
        if (ghost) {
          return `<div class="haze" aria-hidden="true">${body}</div>`;
        }
        return `
          <button type="button" class="${String(onId) === String(iss.id) ? "on" : ""} ${iss.source === "slack" ? "path" : ""}" data-gone="${iss.id}">
            ${body}
          </button>`;
      };
      const walkHtml = (iss) => {
        const steps = (iss && iss.steps) || [];
        if (!steps.length) return "";
        return `<div class="walk-steps">${steps.map((s, i) => {
          const n = i + 1;
          const open = state.walkStep === n;
          return `<button type="button" class="walk-step${open ? " on" : ""}" data-walk="${n}">
            <span class="walk-n">${n}</span>
            <b>${escapeHtml(s.ask)}</b>
            ${open && s.say ? `<span class="walk-say">${escapeHtml(s.say)}</span>` : ""}
          </button>`;
        }).join("")}</div>`;
      };
      const currentCard = current ? card(current, HOME_GATE.label || "") : "";
      const currentWalk = showSteps ? walkHtml(current) : "";
      root.innerHTML = `
        <p class="kicker">Shortcuts</p>
        ${currentCard}${currentWalk}
        ${rest.length ? `<div class="gone-rest"><p class="kicker">Also there</p>${rest.map((iss) => card(iss, null, true)).join("")}</div>` : ""}
      `;
      root.querySelectorAll("[data-gone]").forEach((b) => b.addEventListener("click", () => openGoneInto(b.dataset.gone)));
      root.querySelectorAll("[data-walk]").forEach((b) => b.addEventListener("click", (e) => {
        e.stopPropagation();
        const n = Number(b.dataset.walk);
        state.walkStep = state.walkStep === n ? null : n;
        renderGoneInto();
      }));
      root.querySelectorAll(".gone-tix").forEach((a) => a.addEventListener("click", (e) => e.stopPropagation()));
    }
    window.addEventListener("hashchange", () => {
      if (isOrchEntry()) {
        landOnGate(GATES[0]);
        persist();
        render();
        return;
      }
      const g = resolveGate(readEntryKey()) || GATES[0];
      if (String(g.issueId) === String(HOME_GATE.issueId) && atGateHome()) return;
      landOnGate(g);
      persist();
      render();
    });
    document.getElementById("logo").addEventListener("click", exploreUniverse);
    document.getElementById("padHide").addEventListener("click", () => setPadHidden(true));
    document.getElementById("padShow").addEventListener("click", () => setPadHidden(false));
    document.addEventListener("keydown", (e) => {
      const tag = (e.target && e.target.tagName) || "";
      if (tag === "TEXTAREA" || tag === "INPUT") return;
      if (e.key === "Escape") { stepBack(); return; }
    });

    render();
  </script>
</body>
</html>
