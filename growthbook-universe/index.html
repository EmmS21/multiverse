  <style>
    :root {
      --ink: #14110f;
      --paper: #efe6d4;
      --bg: #12100e;
      --panel: #1c1814;
      --line: #3a332c;
      --mute: #9a8d7c;
      --text: #f3eadc;
      --soft: #cfc3b0;
      --accent: #e7a35a;
      --open: #d85a3a;
      --review: #e7a35a;
      --fixed: #6f9b72;
      --again: #8b7ec8;
      --pad-w: min(260px, 34vw);
      --tcp-grit: repeating-conic-gradient(
        from 0deg,
        rgba(243, 234, 220, 0.65) 0deg 0.35deg,
        transparent 0.35deg 8deg,
        rgba(231, 163, 90, 0.4) 8deg 8.2deg,
        transparent 8.2deg 15deg,
        rgba(255, 255, 255, 0.4) 15deg 15.18deg,
        transparent 15.18deg 24deg
      );
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-text-size-adjust: 100%;
      color-scheme: dark;
    }
    .share-name {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: Outfit, system-ui, sans-serif;
    }
    button {
      font-family: inherit;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    button:focus,
    button:focus-visible {
      outline: none;
    }
    a { color: var(--accent); }

    .shell {
      position: relative;
      height: 100%;
      height: 100dvh;
    }
    .shell.pad-off .pad { display: none; }
    .pad-show {
      display: none;
      position: absolute;
      right: 16px;
      bottom: 18px;
      z-index: 8;
      border: 1px solid rgba(231, 163, 90, 0.55);
      background: rgba(23, 20, 16, 0.18);
      color: var(--accent);
      border-radius: 999px;
      padding: 8px 14px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
    }
    .pad-show:hover { filter: brightness(1.15); }
    .shell.pad-off .pad-show { display: block; }
    .trail {
      border-right: 1px solid #2a2420;
      padding: 16px 10px 24px 14px;
      background: #0c0b0e;
      z-index: 2;
    }
    .main {
      padding: 0;
      min-width: 0;
      position: relative;
      height: 100%;
      height: 100dvh;
      background: #050408;
      overflow: hidden;
    }
    .hud {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 20px;
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10;
      pointer-events: none;
    }
    .hud .where { margin-bottom: 0; pointer-events: auto; }
    .brand {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      min-width: 0;
      flex: 1;
      pointer-events: none;
    }
    .logo, .where { pointer-events: auto; }
    .logo {
      flex: 0 0 auto;
      width: 36px;
      height: 36px;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
    }
    .logo svg { display: block; width: 36px; height: 36px; }
    .logo:hover { filter: brightness(1.18); }
    #watch { pointer-events: auto; }
    .watch {
      pointer-events: auto;
      max-width: 280px;
      background: #171410;
      border: 1px solid var(--accent);
      border-radius: 12px;
      padding: 8px 10px;
      text-align: left;
    }
    .watch .kicker { margin: 0 0 4px; }
    .watch b { display: block; font-size: 13px; line-height: 1.3; margin-bottom: 6px; }
    .watch-row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .watch-row .tix-ext { font-size: 11px; }
    .watch-row button {
      border: 1px solid var(--accent);
      background: var(--accent);
      color: var(--ink);
      border-radius: 999px;
      padding: 4px 8px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
    }
    .watch-row button.ghost {
      background: transparent;
      color: var(--accent);
    }

    .sky {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background:
        radial-gradient(ellipse 90% 55% at 12% 22%, rgba(64, 44, 148, 0.58), transparent 58%),
        radial-gradient(ellipse 80% 50% at 88% 78%, rgba(22, 82, 128, 0.48), transparent 55%),
        radial-gradient(ellipse 50% 40% at 62% 18%, rgba(124, 38, 94, 0.28), transparent 60%),
        radial-gradient(ellipse at 50% 48%, #12101c 0%, #08070f 52%, #020208 100%);
    }
    .shell:not(.pad-off) .sky,
    .shell:not(.pad-off) .sky-weather {
      right: var(--pad-w);
    }
    .shell:not(.pad-off) .hud {
      right: var(--pad-w);
    }
    .sky.scale-galaxy {
      background:
        radial-gradient(ellipse 90% 55% at 16% 24%, rgba(64, 44, 148, 0.48), transparent 58%),
        linear-gradient(180deg, transparent 36%, rgba(90,70,50,0.1) 50%, transparent 64%),
        radial-gradient(ellipse at 50% 50%, #141018 0%, #08060e 70%);
    }
    .sky.scale-star {
      background:
        radial-gradient(ellipse 70% 50% at 50% 46%, rgba(112, 64, 24, 0.3), transparent 46%),
        radial-gradient(ellipse at 50% 50%, #16101a 0%, #08070e 62%, #030208 100%);
    }
    .sky.scale-planet {
      background:
        radial-gradient(ellipse 80% 50% at 78% 70%, rgba(22, 82, 128, 0.32), transparent 50%),
        radial-gradient(ellipse at 50% 58%, #141018 0%, #08070c 70%);
    }
    .sky.scale-planes, .sky.scale-plane {
      background: radial-gradient(ellipse at 50% 40%, #16120e 0%, #060508 70%);
    }
    .sky.scale-worldline {
      background: radial-gradient(ellipse at 42% 58%, #161018 0%, #05040a 70%);
    }
    .sky.scale-helix {
      background: radial-gradient(ellipse at 50% 48%, #1a1214 0%, #07050a 70%);
    }
    .sky.scale-beacon {
      background: radial-gradient(ellipse at 62% 36%, #141820 0%, #05060a 70%);
    }
    .sky.scale-engine, .sky.scale-lab {
      background:
        radial-gradient(ellipse at 22% 58%, #1a1410 0%, transparent 42%),
        radial-gradient(ellipse at 78% 38%, #121820 0%, #05060a 62%);
    }
    .sky.scale-nebula {
      background: radial-gradient(ellipse at 58% 48%, #1a1418 0%, #08060c 68%);
    }
    .sky.scale-galaxy::before {
      background:
        radial-gradient(ellipse 90% 28% at 50% 50%, rgba(243,234,220,0.08), transparent 70%),
        radial-gradient(circle at 50% 50%, transparent 38%, #050408 100%);
    }
    .sky.scale-star::before {
      background: radial-gradient(circle at 50% 50%, rgba(231,163,90,0.16) 0%, transparent 34%, #050408 100%);
    }
    .sky.scale-planet::before {
      background: linear-gradient(180deg, transparent 42%, rgba(18,10,8,0.92) 100%);
    }
    .sky.scale-ticket::before, .sky.scale-box::before {
      background: radial-gradient(circle at 50% 86%, rgba(90,70,50,0.28), transparent 38%),
        linear-gradient(180deg, transparent 0%, transparent 52%, rgba(8,6,12,0.72) 100%);
    }
    .sky.scale-plane.tcp-sky::before {
      background: linear-gradient(180deg, transparent 36%, rgba(231,163,90,0.22) 100%);
    }
    .sky.scale-plane.udp-sky::before {
      background: linear-gradient(180deg, transparent 36%, rgba(94,196,189,0.2) 100%);
    }
    .sky.scale-plane.send-sky::before {
      background: linear-gradient(180deg, transparent 36%, rgba(243,234,220,0.18) 100%);
    }
    .sky.scale-box { background: radial-gradient(ellipse at 50% 70%, #1c1510 0%, #070508 72%); }
    .sky.warping-in { animation: warpIn 0.45s ease-in; }
    .sky.warping-out { animation: warpOut 0.45s ease-in; }
    @keyframes warpIn {
      0% { filter: blur(0); transform: scale(1); opacity: 1; }
      45% { filter: blur(4px); transform: scale(1.03); opacity: 0.78; }
      100% { filter: blur(0); transform: scale(1); opacity: 1; }
    }
    @keyframes warpOut {
      0% { filter: blur(0); transform: scale(1); opacity: 1; }
      45% { filter: blur(4px); transform: scale(0.98); opacity: 0.78; }
      100% { filter: blur(0); transform: scale(1); opacity: 1; }
    }
    .sky::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, transparent 58%, rgba(5, 4, 8, 0.82) 100%);
      pointer-events: none;
      z-index: 1;
    }
    .sky::after {
      content: "";
      position: absolute;
      inset: -8%;
      pointer-events: none;
      z-index: 0;
      opacity: 1;
      animation: starDrift 96s linear infinite;
      background-image:
        radial-gradient(1px 1px at 8% 14%, #f3eadc 50%, transparent 51%),
        radial-gradient(1px 1px at 22% 38%, #f3eadc 50%, transparent 51%),
        radial-gradient(1.5px 1.5px at 41% 11%, #f3eadc 50%, transparent 51%),
        radial-gradient(1px 1px at 63% 22%, #f3eadc 50%, transparent 51%),
        radial-gradient(1px 1px at 81% 9%, #f3eadc 50%, transparent 51%),
        radial-gradient(1px 1px at 91% 41%, #f3eadc 50%, transparent 51%),
        radial-gradient(1.5px 1.5px at 14% 62%, #f3eadc 50%, transparent 51%),
        radial-gradient(1px 1px at 33% 71%, #f3eadc 50%, transparent 51%),
        radial-gradient(1px 1px at 52% 58%, #f3eadc 50%, transparent 51%),
        radial-gradient(1px 1px at 74% 66%, #f3eadc 50%, transparent 51%),
        radial-gradient(1.5px 1.5px at 88% 78%, #f3eadc 50%, transparent 51%),
        radial-gradient(1px 1px at 6% 84%, #f3eadc 50%, transparent 51%),
        radial-gradient(1px 1px at 47% 88%, #f3eadc 50%, transparent 51%),
        radial-gradient(1px 1px at 69% 91%, #f3eadc 50%, transparent 51%),
        radial-gradient(1px 1px at 18% 48%, #f3eadc 50%, transparent 51%),
        radial-gradient(1px 1px at 58% 34%, #f3eadc 50%, transparent 51%),
        radial-gradient(1.5px 1.5px at 77% 51%, #f3eadc 50%, transparent 51%),
        radial-gradient(1px 1px at 95% 63%, #f3eadc 50%, transparent 51%),
        radial-gradient(1px 1px at 37% 24%, #f3eadc 50%, transparent 51%),
        radial-gradient(1px 1px at 4% 31%, #f3eadc 50%, transparent 51%);
    }
    .sky.scale-galaxy::after, .sky.scale-star::after, .sky.scale-ticket::after, .sky.scale-box::after, .sky.scale-planet::after { opacity: 1; }
    @keyframes starDrift {
      from { transform: translate3d(0, 0, 0); }
      to { transform: translate3d(-5%, -4%, 0); }
    }
    .rings, .kepler {
      position: absolute;
      inset: 6% 4%;
      width: 92%;
      height: 88%;
      pointer-events: none;
      z-index: 1;
    }
    .rings ellipse, .kepler ellipse {
      fill: none;
      stroke: rgba(236, 222, 192, 0.42);
      stroke-width: 1.05px;
      vector-effect: non-scaling-stroke;
      stroke-dasharray: 0 2.8 0 7.1 0 1.6 0 11.4 0 4.2 0 6.6 0 2.1 0 9.3 0 3.4;
      stroke-linecap: round;
      animation: wellDrift 48s linear infinite;
    }
    .kepler ellipse.grit {
      stroke: rgba(243, 234, 220, 0.26);
      stroke-width: 0.55px;
      stroke-dasharray: 0 1.4 0 4.8 0 0.9 0 6.6 0 2.2 0 5.1 0 1.1 0 8.4 0 3.3;
      animation-duration: 31s;
      animation-direction: reverse;
    }
    .kepler ellipse.dust {
      stroke: rgba(198, 176, 148, 0.2);
      stroke-width: 0.45px;
      stroke-dasharray: 0 5.6 0 12.8 0 3.2 0 9.4 0 16.2 0 7.1;
      animation-duration: 67s;
    }
    .kepler .moons {
      stroke: rgba(231, 163, 90, 0.32);
      animation-duration: 40s;
      animation-direction: reverse;
    }
    @keyframes wellDrift {
      to { stroke-dashoffset: -56; }
    }
    .web {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }
    .web path {
      fill: none;
      stroke: rgba(231, 163, 90, 0.16);
      stroke-width: 0.5px;
      vector-effect: non-scaling-stroke;
      stroke-dasharray: 1.6 8 0.55 11;
      stroke-linecap: butt;
      animation: wellDrift 80s linear infinite;
    }
    .dust-sheet {
      position: absolute;
      inset: -28%;
      pointer-events: none;
      z-index: 1;
      opacity: 0.14;
      background-image:
        radial-gradient(circle, rgba(210,228,255,0.35) 0.55px, transparent 1px),
        radial-gradient(circle, rgba(255,220,170,0.18) 0.4px, transparent 0.85px);
      background-size: 263px 211px, 191px 167px;
    }
    .sky-spark {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 2;
    }
    .sky-spark i {
      position: absolute;
      width: 2.5px;
      height: 2.5px;
      border-radius: 50%;
      background: #e6ecf5;
      opacity: 0.65;
    }
    .sky-spark i.dim {
      width: 1.25px;
      height: 1.25px;
      background: #c5d4e8;
      animation: glowSoft 8.25s ease-in-out infinite;
    }
    .sky-spark i.spark {
      background: #f7f4ee;
      box-shadow: 0 0 9px rgba(236, 240, 250, 0.92);
      animation: twinkle 2.85s ease-in-out infinite;
    }
    .sky-spark i.warm {
      background: #f0e2c8;
      width: 2.5px;
      height: 2.5px;
      box-shadow: 0 0 7.5px rgba(240, 220, 190, 0.75);
      animation: glowSoft 6.75s ease-in-out infinite;
    }
    .sky-spark i.dying {
      background: #dce6f4;
      animation: dieOff 19.5s ease-in-out infinite;
    }
    .sky-spark i.soft {
      background: #e4eaf4;
      animation: glowSoft 6.4s ease-in-out infinite;
    }
    .sky-spark i.diamond {
      display: none;
      width: 3px;
      height: 3px;
      border-radius: 0;
      background: #e8dff4;
      box-shadow: 0 0 4px rgba(200, 180, 230, 0.45);
      transform: rotate(45deg);
      opacity: 0.55;
      animation: diamondTwinkle 3.15s ease-in-out infinite;
    }
    html.alt-universe .sky-spark i.diamond { display: block; }
    .sky-spark i.spark.shift {
      animation: twinkle 2.85s ease-in-out infinite, hueTwinkle 3.9s ease-in-out infinite;
    }
    .sky-spark i.dim.shift,
    .sky-spark i.soft.shift,
    .sky-spark i.warm.shift {
      animation: glowSoft 6.75s ease-in-out infinite, hueTwinkle 4.8s ease-in-out infinite;
    }
    .sky-spark i.dying.shift {
      animation: dieOff 19.5s ease-in-out infinite, hueTwinkle 6s ease-in-out infinite;
    }
    .sky-spark i.diamond.shift {
      animation: diamondTwinkle 3.15s ease-in-out infinite, hueTwinkle 4.2s ease-in-out infinite;
    }
    html.alt-universe .sky-spark i.diamond.shift {
      animation: diamondHue 3.15s ease-in-out infinite;
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.1; transform: scale(0.62); }
      47% { opacity: 0.58; }
      51% { opacity: 1; transform: scale(1.72); }
      56% { opacity: 0.24; transform: scale(0.78); }
    }
    @keyframes diamondTwinkle {
      0%, 100% { opacity: 0.16; transform: rotate(45deg) scale(0.7); }
      48% { opacity: 0.82; transform: rotate(45deg) scale(1.28); }
      54% { opacity: 1; transform: rotate(45deg) scale(1.6); }
      62% { opacity: 0.3; transform: rotate(45deg) scale(0.82); }
    }
    @keyframes hueTwinkle {
      0%, 100% { background: #e6ecf5; box-shadow: 0 0 5px rgba(230, 236, 245, 0.5); }
      33% { background: #ffd8a8; box-shadow: 0 0 8px rgba(255, 216, 168, 0.62); }
      66% { background: #94c6ff; box-shadow: 0 0 8px rgba(148, 198, 255, 0.6); }
    }
    @keyframes diamondHue {
      0%, 100% { background: #e8dff4; box-shadow: 0 0 4px rgba(200, 180, 230, 0.45); transform: rotate(45deg) scale(0.8); }
      50% { background: #d4b8ea; box-shadow: 0 0 7px rgba(170, 130, 220, 0.5); transform: rotate(45deg) scale(1.2); }
    }
    html.alt-universe .sky.scale-engine,
    html.alt-universe .sky.scale-lab,
    html.alt-universe .sky.scale-universe:has(.orch) {
      background:
        linear-gradient(rgba(92, 48, 140, 0.2), rgba(92, 48, 140, 0.2)),
        radial-gradient(ellipse at 22% 58%, #1a1410 0%, transparent 42%),
        radial-gradient(ellipse at 78% 38%, #121820 0%, #05060a 62%);
    }
    /* Parallel universe sky: ~40% more active than current */
    html.alt-universe .sf-layer b.sf-live {
      animation-duration: 4.4s !important;
    }
    html.alt-universe .sf-layer b.sf-live.field-hue {
      animation-duration: 4.4s, 6s !important;
    }
    html.alt-universe .sky-spark i.spark {
      animation-duration: 2s !important;
    }
    html.alt-universe .sky-spark i.spark.shift {
      animation-duration: 2s, 2.8s !important;
    }
    html.alt-universe .sky-spark i.dim,
    html.alt-universe .sky-spark i.soft,
    html.alt-universe .sky-spark i.warm {
      animation-duration: 4.8s !important;
    }
    html.alt-universe .sky-spark i.dim.shift,
    html.alt-universe .sky-spark i.soft.shift,
    html.alt-universe .sky-spark i.warm.shift {
      animation-duration: 4.8s, 3.4s !important;
    }
    html.alt-universe .sky-spark i.dying {
      animation-duration: 14s !important;
    }
    html.alt-universe .sky-spark i.dying.shift {
      animation-duration: 14s, 4.3s !important;
    }
    html.alt-universe .sky-spark i.diamond {
      animation-duration: 2.25s !important;
    }
    html.alt-universe .sky-spark i.diamond.shift {
      animation-duration: 2.25s !important;
    }
    .sf-burst {
      display: none;
      position: absolute;
      width: 6px;
      height: 6px;
      margin: -3px 0 0 -3px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 2;
      background: radial-gradient(circle, #fffef8 0%, #e0c4ff 28%, rgba(160, 110, 220, 0.35) 48%, transparent 70%);
      opacity: 0;
    }
    html.alt-universe .sf-burst {
      display: block;
    }
    .sf-burst.explode {
      animation: sfExplode 11s linear infinite;
    }
    .sf-burst.split {
      background: radial-gradient(circle, #f8f4ff 0%, #c4a8f0 35%, transparent 70%);
      animation: sfSplitFlash 14s linear infinite;
    }
    .sf-burst.split i {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 3px;
      height: 3px;
      margin: -1.5px 0 0 -1.5px;
      border-radius: 50%;
      background: #e8dff4;
      box-shadow: 0 0 6px rgba(200, 160, 240, 0.85);
      opacity: 0;
      animation: sfShard 14s linear infinite;
    }
    .sf-burst.split i:nth-child(1) { --dx: 0px; --dy: -28px; }
    .sf-burst.split i:nth-child(2) { --dx: 24px; --dy: 16px; animation-delay: inherit; }
    .sf-burst.split i:nth-child(3) { --dx: -24px; --dy: 16px; }
    @keyframes sfExplode {
      0%, 72%, 100% { opacity: 0; transform: scale(0.2); filter: blur(0); }
      74% { opacity: 1; transform: scale(1.4); }
      82% { opacity: 0.55; transform: scale(12); filter: blur(0.6px); }
      90% { opacity: 0; transform: scale(20); filter: blur(1.2px); }
    }
    @keyframes sfSplitFlash {
      0%, 68%, 78%, 100% { opacity: 0; transform: scale(0.3); }
      70% { opacity: 1; transform: scale(1.8); }
      74% { opacity: 0.35; transform: scale(0.6); }
    }
    @keyframes sfShard {
      0%, 72%, 100% { opacity: 0; transform: translate(0, 0) scale(0.4); }
      74% { opacity: 1; transform: translate(0, 0) scale(1); }
      86% { opacity: 0.7; transform: translate(var(--dx), var(--dy)) scale(0.75); }
      94% { opacity: 0; transform: translate(calc(var(--dx) * 1.6), calc(var(--dy) * 1.6)) scale(0.2); }
    }
    html.universe-shift .starfield {

      if (String(iss.id) === "4477" && state.showAirSteps) {
        state.showAirSteps = false;
        state.walkStep = null;
        renderGoneInto();
        return;
      }
      state.showAirSteps = String(iss.id) === "4477";
      state.walkStep = null;
      const gate = gateForIssue(iss.id);
      if (gate) {
        setHomeGate(gate);
        writeEntryUrl(gate);
      }
      const path = shortcutPath(iss);
      state.selectedIssue = iss.id;
      state.watching = { id: iss.id, path };
      rememberPlace(path);
      persist();
      if (samePath(state.path, path)) render();
      else warpTo(path);
    }
    function hopTo(path, ticketId) {
      const iss = ticketId ? lookupIssue(ticketId) : null;
      const p = iss && hasNextBoxes(iss) ? validPath(shortcutPath(iss)) : validPath(path);
      if (iss) {
        const gate = gateForIssue(iss.id);
        if (gate) {
          setHomeGate(gate);
          writeEntryUrl(gate);
        }
        state.selectedIssue = iss.id;
        state.watching = { id: iss.id, path: p };
        persist();
      }
      if (samePath(state.path, p)) render();
      else warpTo(p);
    }
    function jumpToWatching() {
      if (!state.watching) return;
      const iss = lookupIssue(state.watching.id);
      if (!iss) return;
      state.selectedIssue = iss.id;
      warpTo(shortcutPath(iss));
    }
    function stopWatching() {
      state.watching = null;
      persist();
      render();
    }
    function renderWatch() {
      const el = document.getElementById("watch");
      const w = state.watching && lookupIssue(state.watching.id);
      if (!w) { el.innerHTML = ""; return; }
      const rootIssue = parseIssueId(state.path[0]);
      if (rootIssue && String(rootIssue.id) === String(w.id)) { el.innerHTML = ""; return; }
      const boxes = (w.thread || []).length;
      const where = pathLabel(state.watching.path);
      const gh = w.url
        ? `<a class="tix-ext" href="${escapeHtml(w.url)}" target="_blank" rel="noopener noreferrer">ticket</a>`
        : "";
      el.innerHTML = `
        <div class="watch">
          <p class="kicker">Looking at${boxes ? " · " + boxes + " next" : ""}</p>
          <b>${escapeHtml(issueTag(w))}</b>
          ${where ? `<p class="kicker" style="margin:6px 0 8px;text-transform:none;letter-spacing:0;font-size:11px;line-height:1.35">${escapeHtml(where)}</p>` : ""}
          <div class="watch-row">
            <button type="button" id="watchJump">Go there</button>
            <button type="button" class="ghost" id="watchOff">Put away</button>
            ${gh}
          </div>
        </div>`;
      document.getElementById("watchJump").onclick = jumpToWatching;
      document.getElementById("watchOff").onclick = stopWatching;
    }

    function enterRock(which) {
      const id = "rock:" + which;
      if (!ROCKS[id]) return;
      const base = state.path.filter((p) => !String(p).startsWith("rock:"));
      if (!base.includes("connection")) base.push("connection");
      flyThen(() => {
        state.path = [...base, id];
        rememberPlace(state.path);
        persist();
        render();
      }, "in");
    }
    const strataTilt = { x: 18, y: -28 };
    let strataDragging = false;
    const STRATA_POS = {
      ws: { left: 50, top: 32, z: 110, rock: "tcp" },
      send: { left: 24, top: 66, z: -80, rock: "udp" },
      get: { left: 76, top: 66, z: -80, rock: "udp" }
    };
    function phoneSky() {
      return window.matchMedia("(max-width: 720px)").matches;
    }
    function noHoverTips() {
      return window.matchMedia("(hover: none), (pointer: coarse), (max-width: 720px)").matches;
    }
    function labTip(text) {
      if (noHoverTips()) return "";
      return `<span class="lab-tip">${escapeHtml(text)}</span>`;
    }
    function stripLabTips() {
      const off = noHoverTips();
      document.documentElement.classList.toggle("no-hover-tips", off);
      if (off) document.querySelectorAll(".lab-tip").forEach((el) => el.remove());
    }
    function strataSlot(id) {
      const s = STRATA_POS[id];
      if (!s || !phoneSky()) return s;
      if (id === "ws") return Object.assign({}, s, { left: 50, top: 38 });
      if (id === "send") return Object.assign({}, s, { left: 26, top: 60 });
      if (id === "get") return Object.assign({}, s, { left: 74, top: 60 });
      return s;
    }
    function boxSlot(i, n) {
      if (!phoneSky()) {
        if (n === 1) return { left: 50, top: 72 };
        if (n === 2) return { left: i === 0 ? 32 : 68, top: 72 };
        return { left: 26 + (44 * i) / Math.max(n - 1, 1), top: 72 };
      }
      if (n === 1) return { left: 50, top: 48 };
      if (n === 2) return i === 0 ? { left: 28, top: 48 } : { left: 72, top: 48 };
      return { left: 22 + (56 * i) / Math.max(n - 1, 1), top: 48 };
    }
    function toggleStrata() {
      state.strata = !state.strata;
      persist();
      render();
    }
    function bindStrataDrag() {
      const stage = document.getElementById("depthStage");
      const world = document.getElementById("depthWorld");
      if (!stage || !world) return;
      let lastX = 0;
      let lastY = 0;
      stage.addEventListener("pointerdown", (e) => {
        if (e.target.closest("button")) return;
        strataDragging = true;
        lastX = e.clientX;
        lastY = e.clientY;
        stage.setPointerCapture(e.pointerId);
      });
      stage.addEventListener("pointermove", (e) => {
        if (!strataDragging) return;
        strataTilt.y += (e.clientX - lastX) * 0.32;
        strataTilt.x -= (e.clientY - lastY) * 0.32;
        strataTilt.x = Math.max(-38, Math.min(52, strataTilt.x));
        lastX = e.clientX;
        lastY = e.clientY;
        world.style.transform = `rotateX(${strataTilt.x}deg) rotateY(${strataTilt.y}deg)`;
      });
      stage.addEventListener("pointerup", () => { strataDragging = false; });
      stage.addEventListener("pointercancel", () => { strataDragging = false; });
    }

    function render() {
      applyPad();
      recoverPath();
      const sky = document.getElementById("sky");
      const node = here();
      if (!node) return;
      const chain = chainFromPath();
      const depth = chain.length - 1;
      const parent = chain.length > 1 ? chain[chain.length - 2] : null;
      const kids = node.children || [];
      const strataHere = node.id === "connection";
      const atRock = !!node.rock && !node.rockBox;
      const atRockBox = !!node.rockBox;
      const atRockStay = !!(atRockBox && parent && parent.rock && !parent.rockBox);
      const rockKids = atRockStay ? (parent.children || []) : (atRock ? kids : []);
      const skyKids = (atRock || atRockStay) ? rockKids : kids;
      const parsedHere = parseIssueId(node.id);
      const atTicket = !!(parsedHere && parsedHere.boxes.length === 0);
      const atBox = !!(parsedHere && parsedHere.boxes.length > 0);
      const atDna = node.kind === "dna";
      const atWorldline = node.kind === "worldline";
      const atAct = node.kind === "act";
      const atEngine = node.kind === "engine";
      const atLab = node.kind === "lab";
      const atEngineStay = !!(parent && parent.kind === "engine" && (node.kind === "lab"));
      const atWorldlineStay = !!(parent && parent.kind === "worldline" && atAct);
      const atBeacon = node.kind === "beacon";
      const atBase = node.kind === "strand";
      const atSignal = node.kind === "signal";
      const cosmic = atDna || atWorldline || atWorldlineStay || atAct || atBeacon || atBase || atSignal || atEngine || atEngineStay || atLab;
      const boxStart = parsedHere ? parsedHere.boxes.length : 0;
      const asBoxes = (atTicket || atBox || atRock || atRockStay) && !cosmic;
      const boxSteps = asBoxes && (atTicket || atBox) ? skyKids : [];
      const onlyNext = boxSteps.length === 1 ? boxSteps[0] : null;
      const issues = issuesOnNode(node);
      const issue = (state.watching && ISSUES[state.watching.id])
        || (state.selectedIssue && ISSUES[state.selectedIssue])
        || null;
      const atUniverse = node.id === "universe";
      const uniDepth = (chain[0] && chain[0].id === "universe") ? depth : -1;
      const gateHere = atTicket && isHomeGate(parsedHere.id);
      const orchHere = gateHere && HOME_GATE && HOME_GATE.lab === "orch";
      const rootedInIssue = isIssuePath(state.path);
      const closeLabHere = node.code === "closeLab"
        || (node.children || []).some((c) => c.code === "closeLab")
        || (parent && (parent.children || []).some((c) => c.code === "closeLab"));
      document.querySelector(".hud").classList.remove("issue-walk");
      if (onPhone() || closeLabHere || orchHere) {
        document.getElementById("where").innerHTML = "";
      } else {
        document.getElementById("where").innerHTML = chain.map((n, i) => {
          if (i === chain.length - 1) return `<span class="now">${escapeHtml(n.name)}</span>`;
          return `<button data-go="${n.id}" type="button">${escapeHtml(n.name)}</button><span class="sep">/</span>`;
        }).join("");
        document.querySelectorAll("#where [data-go]").forEach((b) => b.addEventListener("click", () => goTo(b.dataset.go)));
      }

      const home = atGateHome();
      const warpOut = rootedInIssue;
      const phone = onPhone();
      const orbTickets = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 7.5h15v3c-1.35.35-1.35 2.65 0 3v3h-15v-3c1.35-.35 1.35-2.65 0-3v-3z" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10 8.2l-1.2 7.6M15.2 8.2l-1.2 7.6M8 11h8M7.6 14.2h8" fill="none" stroke="currentColor" stroke-width="1.35"/></svg>`;
      document.querySelector(".shell").classList.remove("hops-on");
      document.getElementById("ship").innerHTML = phone ? `
        <div class="ship-orbit">
          <button class="ship-orb ${state.hidePad ? "" : "on"}" type="button" id="shipTickets" aria-label="Tickets" title="Tickets">${orbTickets}</button>
        </div>
        <div class="ship-nav">
          <button class="ship-back" type="button" id="shipBack" ${home ? "disabled" : ""}>Step back</button>
          <button class="ship-warp" type="button" id="shipWarp">${warpOut ? "Out to GrowthBook" : (HOME_GATE.issueId != null ? ("Warp to #" + HOME_GATE.issueId) : "Warp to GrowthBook")}</button>
          ${state.warpBack ? `<button class="ship-warp" type="button" id="shipWarpBack">Warp back</button>` : ""}
        </div>
      ` : `
        <button class="ship-back" type="button" id="shipBack" ${home ? "disabled" : ""}>Step back</button>
        <button class="ship-warp" type="button" id="shipWarp">${warpOut ? "Out to GrowthBook" : (HOME_GATE.issueId != null ? ("Warp to #" + HOME_GATE.issueId) : "Warp to GrowthBook")}</button>
        ${state.warpBack ? `<button class="ship-warp" type="button" id="shipWarpBack">Warp back</button>` : ""}
      `;
      document.getElementById("shipBack").onclick = stepBack;
      document.getElementById("shipWarp").onclick = warpOut ? exploreUniverse : warpHome;
      const warpBackBtn = document.getElementById("shipWarpBack");
      if (warpBackBtn) warpBackBtn.onclick = warpBack;
      const shipTickets = document.getElementById("shipTickets");
      if (shipTickets) {
        shipTickets.onclick = () => {
          const opening = !!state.hidePad;
          if (opening) state.hideExplored = true;
          setPadHidden(!state.hidePad);
          if (opening) render();
        };
      }
      document.querySelectorAll(".ship-hop").forEach((b) => b.addEventListener("click", () => {
        hopTo(b.dataset.hop.split(","), b.dataset.ticket || null);
      }));
      renderWatch();

      const hues = [32, 18, 210, 40, 265, 8];
      const knownKids = skyKids.filter((c) => !c.unexplored);
      const now = performance.now();
      const galPeriod = 90000;
      const starPeriod = 100000;
      const planetPeriod = 80000;
      const moonPeriod = 70000;
      const webPts = atUniverse ? knownKids.map((_, i) => bodyOrbitPos(i, knownKids.length, now, 32, 30, galPeriod)) : [];
      const moonRx = depth === 1 ? 26 : depth === 2 ? 16 : 26;
      const moonRy = depth === 1 ? 20 : depth === 2 ? 10 : 22;
      const starRx = 34;
      const starRy = 28;
      const planetRx = 34;
      const planetRy = 18;
      const engineNode = atEngine ? node : (atEngineStay ? parent : null);
      const bodies = atEngine || atEngineStay
        ? engineHtml(engineNode, atEngineStay ? node.id : null)
        : atWorldline || atWorldlineStay
        ? worldlineHtml(atWorldline ? kids : (parent.children || []), atWorldlineStay ? node.id : null)
        : atDna
        ? dnaHtml(kids)
        : atBase && parent && parent.kind === "dna"
        ? dnaHtml(parent.children || [], node.id)
        : atBeacon
        ? beaconHtml(kids)
        : atSignal && parent && parent.kind === "beacon"
        ? beaconHtml(parent.children || [], node.id)
        : onlyNext
        ? ""
        : skyKids.map((c, i) => {
        const n = countInside(c);
        const g = nodeIsMapped(c);
        const knownI = knownKids.indexOf(c);
        const slot = strataHere ? strataSlot(c.id) : null;
        const p = slot
          ? { left: slot.left, top: slot.top, z: slot.z, rock: slot.rock }
          : c.unexplored
          ? { left: 72, top: phoneSky() ? 48 : 70 }
          : asBoxes
          ? boxSlot(i, skyKids.length)
          : atUniverse
          ? webPts[knownI]
          : uniDepth === 1
          ? bodyOrbitPos(knownI, knownKids.length, now, starRx, starRy, starPeriod)
          : uniDepth === 2
          ? bodyOrbitPos(knownI, knownKids.length, now, planetRx, planetRy, planetPeriod)
          : bodyOrbitPos(knownI, knownKids.length, now, 30, 26, planetPeriod);
        const zStyle = slot ? `;transform:translate(-50%,-50%) translateZ(${slot.z}px)` : "";
        const rockClass = slot && slot.rock ? " rock-" + slot.rock : "";
        const rockTag = slot && slot.rock ? `<span class="rock-tag">${slot.rock}</span>` : "";
        if (asBoxes && (atTicket || atBox)) {
          const p = boxSlot(i, skyKids.length);
          const deeper = (c.children || []).length > 0;
          const extra = !!(c.who && c.who !== c.name);
          const canEnter = deeper || extra;
          const tag = canEnter ? "button" : "div";
          const enter = canEnter ? ` type="button" data-enter="${c.id}"` : "";
          return `<${tag} class="moon step ${slackPathNode(c) ? "haze path" : ""}"${enter} style="left:${p.left}%;top:${p.top}%">
            <span class="globe"></span>
            <span class="pname">${escapeHtml(c.name)}</span>
          </${tag}>`;
        }
        if (asBoxes) {
          const on = c.id === node.id;
          const deeper = (c.children || []).length > 0;
          const extra = !!(c.who && c.who !== c.name);
          if (!deeper && !extra) {
            return `<div class="land still" data-box="${i}" style="left:${p.left}%;top:${p.top}%">
              <span class="pname">${escapeHtml(c.name)}</span>
            </div>`;
          }
          return `<button class="land ${on ? "on" : ""} ${slackPathNode(c) ? "haze path" : ""}" type="button" data-enter="${c.id}" data-box="${i}" style="left:${p.left}%;top:${p.top}%">
            <span class="pname">${escapeHtml(c.name)}</span>
          </button>`;
        }
        if (c.unexplored) {
          return `<button class="body nebula haze path" type="button" data-enter="${c.id}" style="left:${p.left}%;top:${p.top}%">
            <span class="cloud c1"></span>
            <span class="cloud c2"></span>
            <span class="cloud c3"></span>
            <span class="g-name">${escapeHtml(c.name)}</span>
            ${g ? `<span class="gone-mark">gone into</span>` : ""}
            ${g && n ? `<span class="g-count">${n}</span>` : ""}
          </button>`;
        }
        const kind = atUniverse ? "galaxy" : uniDepth === 1 ? "star-sys" : "planet";
        const mark = g ? `<span class="gone-mark">gone into</span>` : "";
        if (kind === "galaxy") {
          return `<button class="body galaxy haze ${nodeIsMapped(c) ? "known" : ""}" type="button" data-enter="${c.id}" style="left:${p.left}%;top:${p.top}%">
            <span class="g-halo"></span>
            ${c.id === "connection" ? `<span class="g-strata">TCP · UDP · Stream.Send</span>` : ""}
            ${galaxySvg(knownI, hues[knownI % hues.length])}
            <span class="g-name">${escapeHtml(c.name)}</span>
            ${mark}
            ${g && n ? `<span class="g-count">${n}</span>` : ""}
          </button>`;
        }
        if (kind === "star-sys") {
          const starK = rockClass ? "" : kindFrom(c.id, STAR_KINDS);
          const tw = idHash(c.id);
          return `<button class="body star-sys${rockClass} ${starK} ${farClass(c)}" type="button" data-enter="${c.id}" style="left:${p.left}%;top:${p.top}%${zStyle};--tw:${(2.6 + (tw % 5) * 0.7).toFixed(2)}s;--tw-delay:-${tw % 7}s">
            ${rockTag}
            <span class="orbit"></span>
            <span class="fire"></span>
            <span class="core"></span>
            <span class="pname">${escapeHtml(c.name)}</span>
            ${mark}
            ${g && n ? `<span class="g-count">${n}</span>` : ""}
          </button>`;
        }
        const pKind = kindFrom(c.id, PLANET_KINDS);
        const near = p.front != null ? (0.7 + p.front * 0.42).toFixed(2) : "1";
        const z = p.front != null ? 3 + Math.round(p.front * 5) : 3;
        return `<button class="planet ${pKind} ${planetHasRings(pKind) ? "has-rings" : ""} ${farClass(c)}" type="button" data-enter="${c.id}" style="left:${p.left}%;top:${p.top}%;z-index:${z};--near:${near};${spinVars(c.id)}">
          ${planetHasRings(pKind) ? planetRingHtml() : `<span class="globe"></span>`}
          <span class="pname">${escapeHtml(c.name)}</span>
          ${mark}
          ${g && n ? `<span class="count">${n}</span>` : ""}
        </button>`;
      }).join("");

      const moons = issues.map((iss, i) => {
        const p = bodyOrbitPos(i, issues.length, now, moonRx, moonRy, moonPeriod);
        const on = issue && String(issue.id) === String(iss.id) ? "on" : "";
        const seen = hasLooked(iss.id);
        const deep = seen && hasNextBoxes(iss);
        const maybe = iss.status === "maybe";
        const st = STATUS_CLASS[iss.status] || "";
        const tag = issueTag(iss);
        const lab = issueLabel(iss);
        const mapped = isMappedTicket(iss);
        const sub = mapped
          ? [deep ? countBoxes(iss.thread) + " next" : "", isGateIssue(iss.id) ? lab : ""].filter(Boolean).join(" · ")
          : "";
        const slack = iss.source === "slack";
        return `<button class="moon ${on} ${maybe ? "maybe" : ""} ${mapped ? "" : "haze"} ${slack ? "path" : ""} ${st}" type="button" data-issue="${iss.id}" title="${escapeHtml(tag + " " + lab)}" style="left:${p.left}%;top:${p.top}%">
          <span class="globe"></span>
          <span class="pname">${escapeHtml(tag)}</span>
          ${sub ? `<small>${escapeHtml(sub)}</small>` : ""}
        </button>`;
      }).join("");

      const worldBodies = strataHere
        ? `<div class="depth-stage" id="depthStage">
            <div class="depth-world" id="depthWorld" style="transform:rotateX(${phoneSky() ? 4 : strataTilt.x}deg) rotateY(${phoneSky() ? 0 : strataTilt.y}deg)">
              <div class="plane-ring tcp"></div>
              <div class="plane-ring udp"></div>
              <button class="plane-lab tcp tcp-chip" type="button" data-rock="tcp"><small>Websocket</small>TCP</button>
              <button class="plane-lab udp udp-chip" type="button" data-rock="udp"><small>WebRTC</small>UDP</button>
              <svg class="filament" viewBox="0 0 100 100" preserveAspectRatio="none">
                <path d="M50 32 Q62 48 76 66"/>
              </svg>
              ${bodies}
            </div>
          </div>`
        : bodies;

      const showMoonLand = (atTicket || atBox) && !cosmic;
      const showStar = uniDepth === 2 && !strataHere && !atRock && !atRockBox && !showMoonLand && !cosmic && !node.unexplored;
      const showPlanetHere = uniDepth >= 3 && !showMoonLand && !cosmic && !atRock && !atRockBox && !node.unexplored;
      const showStarRing = uniDepth === 1 && !strataHere && !atRock && !atRockBox && !node.unexplored && knownKids.length;
      const showPlanetRing = uniDepth === 2 && !strataHere && !atRock && !atRockBox && !node.unexplored && knownKids.length;
      const showMoonRing = issues.length && !strataHere && !atRock && !atRockBox && !showMoonLand && !cosmic && uniDepth !== 1 && uniDepth >= 0;
      const gateIss = gateHere ? lookupIssue(parsedHere.id) : null;
      const placeLab = atUniverse
        ? "GrowthBook"
        : gateHere && gateIss
        ? (gateIss.see || issueTag(gateIss))
        : node.name;
      const place = onPhone() ? "" : `<div class="place${gateHere && gateIss && gateIss.see ? " has-sum" : ""}">${escapeHtml(placeLab)}</div>`;
      const hereKind = showPlanetHere ? kindFrom(node.id, PLANET_KINDS) : "";
      const centerObj = (atRock || atRockBox)
        ? `<div class="rock-read ${node.rock || ""}">
            <span class="pname">${escapeHtml(node.name)}</span>
            <p class="sub">${escapeHtml(node.who || "")}</p>
          </div>`
        : cosmic
        ? ""
        : onlyNext
        ? hereMoonHtml(`${atBox ? "box" : "landed"} clickable`, `<span class="pname">${escapeHtml(node.name)}</span>`, onlyNext.id)
        : boxSteps.length
        ? ""
        : gateHere
        ? hereMoonHtml("landed gate", `<span class="pname">${escapeHtml(gateIss.see || issueTag(gateIss))}</span>`)
        : showMoonLand
        ? hereMoonHtml(atBox ? "box" : "landed", `<span class="pname">${escapeHtml(node.name)}</span>`)
        : showStar
        ? `<div class="here-star">${starFireSvg(node.id)}<span class="pname">${escapeHtml(node.name)}</span></div>`
        : showPlanetHere
        ? `<div class="here-planet ${hereKind}${planetHasRings(hereKind) ? " has-rings" : ""}" style="${spinVars(node.id)}">${planetHasRings(hereKind) ? planetRingHtml() : `<span class="globe"></span>`}<span class="pname">${escapeHtml(node.name)}</span></div>`
        : "";

      const scale = orchHere ? "universe"
        : atEngine || atEngineStay ? "engine"
        : atWorldline || atWorldlineStay ? "worldline"
        : atDna || atBase ? "helix"
        : atBeacon || atSignal ? "beacon"
        : showMoonLand && atBox ? "box"
        : showMoonLand ? "ticket"
        : atRock || atRockBox ? "plane"
        : strataHere ? "planes"
        : node.unexplored ? "nebula"
        : atUniverse ? "universe"
        : uniDepth === 1 ? "galaxy"
        : uniDepth === 2 ? "star"
        : "planet";
      sky.className = "sky scale-" + scale + (state.strata ? " strata-on" : "") + ((atRock || atRockBox) && node.rock ? " " + node.rock + "-sky" : "");

      const kepler = showStarRing || showPlanetRing || showMoonRing
        ? `<svg class="kepler" viewBox="0 0 100 100" preserveAspectRatio="none">
            ${showStarRing ? gritOrbit(starRx, starRy) : ""}
            ${showPlanetRing ? gritOrbit(planetRx, planetRy) : ""}
            ${showMoonRing ? gritOrbit(moonRx, moonRy, "moons") : ""}
          </svg>`
        : "";

      const skyDust = (!strataHere && !atRock && !atRockBox)
        ? starfieldHtml()
        : "";
      const belts = showPlanetRing ? beltHtml("star") : showStarRing ? beltHtml("galaxy") : showPlanetHere ? beltHtml("planet") : "";

      document.getElementById("sky").innerHTML = orchHere ? `
        ${skyDust}
        ${gateHere ? `<div class="milky milky-out"></div>` : ""}
        ${place}
        ${orchHtml()}
        ${gateHere ? `<button class="body galaxy out-universe haze" type="button" data-out="universe">
            <span class="g-halo"></span>
            ${galaxySvg(0, 32)}
            <span class="g-name">GrowthBook</span>
          </button>` : ""}
      ` : `
        ${skyDust}
        ${belts}
        ${atUniverse ? `<div class="milky"></div>` : ""}
        ${gateHere && rootedInIssue ? `<div class="milky milky-out"></div>` : ""}
        ${atUniverse ? webHtml(webPts) : ""}
        ${uniDepth === 1 && !strataHere && !node.unexplored ? `<div class="in-galaxy"></div>` : ""}
        ${strataHere ? `<div class="plane-wash"></div>` : ""}
        ${node.unexplored ? `<div class="nebula-wash"></div>` : ""}
        ${kepler}
        ${atRock || atRockBox ? `<div class="horizon ${node.rock}"></div>` : ""}
        ${place}
        ${centerObj}
        ${worldBodies}
        ${gateHere && rootedInIssue ? `<button class="body galaxy out-universe haze" type="button" data-out="universe">
            <span class="g-halo"></span>
            ${galaxySvg(0, 32)}
            <span class="g-name">GrowthBook</span>
          </button>` : ""}
        ${strataHere ? `
          <button class="land rock-door" type="button" data-rock="tcp" style="${phoneSky() ? "left:18%;top:14%" : "left:16%;top:22%"}">
            <span class="pname">TCP</span>
            <small>ordered stream</small>
          </button>
          <button class="land rock-door send" type="button" data-rock="stream-send" style="${phoneSky() ? "left:50%;top:14%" : "left:50%;top:12%"}">
            <span class="pname">Stream.Send</span>
            <small>batch onto TCP</small>
          </button>
          <button class="land rock-door udp" type="button" data-rock="udp" style="${phoneSky() ? "left:82%;top:14%" : "left:78%;top:22%"}">
            <span class="pname">UDP</span>
            <small>WebRTC media</small>
          </button>` : ""}
        ${showMoonLand ? "" : moons}
      `;
      document.querySelectorAll("[data-enter]").forEach((b) => b.addEventListener("click", () => enterChild(b.dataset.enter, b)));
      document.querySelectorAll("[data-warp]").forEach((b) => b.addEventListener("click", (e) => {
        e.stopPropagation();
        warpFromSky(b.dataset.warp);
      }));
      document.querySelectorAll("#sky [data-go]").forEach((b) => b.addEventListener("click", () => goTo(b.dataset.go)));
      document.querySelectorAll("#sky [data-issue]").forEach((b) => b.addEventListener("click", () => enterIssue(b.dataset.issue, b)));
      document.querySelectorAll("[data-rock]").forEach((b) => b.addEventListener("click", () => enterRock(b.dataset.rock)));
      document.querySelectorAll("[data-out]").forEach((b) => b.addEventListener("click", () => {
        if (state.path[0] === "universe") return;
        document.querySelectorAll("[data-enter], [data-issue], [data-out]").forEach((x) => {
          if (x !== b) x.classList.add("fade");
        });
        b.classList.add("zoom");
        flyThen(applyUniverse, "out");
      }));
      bindStrataDrag();
      if (!atLab && !atEngine && !atEngineStay) labStop();
      if (!orchHere) {
        orchStop();
        if (!document.getElementById("closeStage")) {
          document.documentElement.classList.remove("alt-universe", "universe-shift");
        }
      }
      if (atDna || atBase) {
        startCosmicMotion({ helixKids: atDna ? kids : (parent.children || []), onId: atBase ? node.id : null });
      } else if (atWorldline || atWorldlineStay) {
        startCosmicMotion({ mini: true });
      } else if (atEngine || atEngineStay || atLab) {
        startCosmicMotion({ mini: true });
        bindLab();
      } else if (atBeacon || atSignal) {
        startCosmicMotion({ signals: true });
      } else if (orchHere) {
        stopSkyMotion();
        bindOrch();
      } else if (atTicket || atBox || atRock || atRockBox) {
        stopSkyMotion();
      } else if (strataHere) {
        startStrataMotion();
      } else if (atRock) {
        stopSkyMotion();
      } else {
        const groups = [];
        if (atUniverse) groups.push({ sel: "#sky .galaxy", rx: 32, ry: 30, period: galPeriod, web: true });
        else if (uniDepth === 1) groups.push({ sel: "#sky .star-sys", rx: starRx, ry: starRy, period: starPeriod });
        else if (uniDepth === 2) groups.push({ sel: "#sky .planet", rx: planetRx, ry: planetRy, period: planetPeriod });
        else if (uniDepth > 2) groups.push({ sel: "#sky .planet", rx: 30, ry: 26, period: planetPeriod });
        if (document.querySelector("#sky .moon")) groups.push({ sel: "#sky .moon", rx: moonRx, ry: moonRy, period: moonPeriod });
        startSkyMotion(groups);
      }

      const chips = atRock || atRockStay
        ? `<div class="dock-tix">
            <button type="button" class="${node.rock === "tcp" && atRock ? "on" : ""}" data-rock="tcp">TCP</button>
            <button type="button" class="${node.rock === "send" && atRock ? "on" : ""}" data-rock="stream-send">Stream.Send</button>
            <button type="button" class="${node.rock === "udp" && atRock ? "on" : ""}" data-rock="udp">UDP</button>
          </div>`
        : !atTicket && !atBox && issues.length
        ? `<div class="dock-tix">${issues.map((iss) => ticketChipHtml(iss, issue && issue.id)).join("")}</div>`
        : atEngine || atEngineStay
        ? ""
        : atWorldlineStay
        ? `<div class="dock-tix">${(parent.children || []).map((c) => `
            <button type="button" class="${c.id === node.id ? "on" : ""}" data-enter="${c.id}">${escapeHtml(c.name)}</button>
          `).join("")}</div>`
        : cosmic && (atWorldline || atDna || atBeacon) && kids.length
        ? `<div class="dock-tix">${kids.map((c) => `
            <button type="button" class="${c.id === node.id ? "on" : ""}" data-enter="${c.id}">${escapeHtml(c.name)}</button>
          `).join("")}</div>`
        : (atBase && parent && parent.children || atSignal && parent && parent.children)
        ? `<div class="dock-tix">${(parent.children || []).map((c) => `
            <button type="button" class="${c.id === node.id ? "on" : ""}" data-enter="${c.id}">${escapeHtml(c.name)}</button>
          `).join("")}</div>`
        : "";
      if (rootedInIssue) {
        document.getElementById("brief").innerHTML = "";
      } else {
      document.getElementById("brief").innerHTML = `
        <p class="kicker">${escapeHtml(node.name)}</p>
          <p class="who">${escapeHtml(atRock || atRockBox ? (node.who || "") : strataHere ? "Click TCP, UDP, or Stream.Send. TCP is the ordered stream. Stream.Send writes a batch onto that person's TCP. UDP skips a hole and keeps voice flowing." : (node.who || ""))}</p>
          ${node.id === "room" && node.deep ? `<p class="who">${escapeHtml(node.deep)}</p>` : ""}
        ${chips}
      `;
      document.querySelectorAll("#brief [data-enter]").forEach((b) => b.addEventListener("click", () => enterChild(b.dataset.enter, b)));
      document.querySelectorAll("#brief [data-go]").forEach((b) => b.addEventListener("click", () => goTo(b.dataset.go)));
      document.querySelectorAll("#brief [data-issue]").forEach((b) => b.addEventListener("click", () => enterIssue(b.dataset.issue)));
      document.querySelectorAll("#brief [data-rock]").forEach((b) => b.addEventListener("click", () => enterRock(b.dataset.rock)));
      }
      renderGoneInto();
      notePlace();
    }

    function renderGoneInto() {
      const root = document.getElementById("gone");
      const current = lookupIssue(HOME_GATE.issueId);
      const featuredIds = new Set(current ? [String(current.id)] : []);
      const rest = goneIntoTickets().filter((iss) => !featuredIds.has(String(iss.id)));
      const onId = state.watching ? state.watching.id : state.selectedIssue;
      const showSteps = !!state.showAirSteps;
      const card = (iss, head, ghost) => {
        const title = iss.see || head || issueLabel(iss) || iss.title || "";
        const blurb = iss.see ? "" : "";
        const tix = iss.see
          ? ""
          : iss.url
          ? `<a class="gone-tix" href="${escapeHtml(iss.url)}" target="_blank" rel="noopener noreferrer" tabindex="-1">${escapeHtml(issueTag(iss))}</a>`
          : `<span class="gone-tix">${escapeHtml(issueTag(iss))}</span>`;
        const body = `<b>${escapeHtml(title)}</b>
            ${blurb ? `<span class="gone-blurb">${escapeHtml(blurb)}</span>` : ""}
            ${tix}`;
        if (ghost) {
          return `<div class="haze" aria-hidden="true">${body}</div>`;
        }
        return `
          <button type="button" class="${String(onId) === String(iss.id) ? "on" : ""} ${iss.source === "slack" ? "path" : ""}" data-gone="${iss.id}">
            ${body}
          </button>`;
      };
      const walkHtml = (iss) => {
        const steps = (iss && iss.steps) || [];
        if (!steps.length) return "";
        return `<div class="walk-steps">${steps.map((s, i) => {
          const n = i + 1;
          const open = state.walkStep === n;
          return `<button type="button" class="walk-step${open ? " on" : ""}" data-walk="${n}">
            <span class="walk-n">${n}</span>
            <b>${escapeHtml(s.ask)}</b>
            ${open && s.say ? `<span class="walk-say">${escapeHtml(s.say)}</span>` : ""}
          </button>`;
        }).join("")}</div>`;
      };
      const currentCard = current ? card(current, HOME_GATE.label || "") : "";
      const currentWalk = showSteps ? walkHtml(current) : "";
      root.innerHTML = `
        <p class="kicker">Shortcuts</p>
        ${currentCard}${currentWalk}
        ${rest.length ? `<div class="gone-rest"><p class="kicker">Also there</p>${rest.map((iss) => card(iss, null, true)).join("")}</div>` : ""}
      `;
      root.querySelectorAll("[data-gone]").forEach((b) => b.addEventListener("click", () => openGoneInto(b.dataset.gone)));
      root.querySelectorAll("[data-walk]").forEach((b) => b.addEventListener("click", (e) => {
        e.stopPropagation();
        const n = Number(b.dataset.walk);
        state.walkStep = state.walkStep === n ? null : n;
        renderGoneInto();
      }));
      root.querySelectorAll(".gone-tix").forEach((a) => a.addEventListener("click", (e) => e.stopPropagation()));
    }
    window.addEventListener("hashchange", () => {
      const g = resolveGate(readEntryKey()) || GATES[0];
      if (!g) return;
      if (g.issueId != null && lookupIssue(g.issueId)) {
        if (String(g.issueId) === String(HOME_GATE.issueId) && atGateHome()) return;
        landOnGate(g);
      } else {
        setHomeGate(g);
        state.path = ["universe"];
        state.selectedIssue = null;
        applyUniverse();
      }
      persist();
      render();
    });
    document.getElementById("logo").addEventListener("click", exploreUniverse);
    document.getElementById("padHide").addEventListener("click", () => setPadHidden(true));
    document.getElementById("padShow").addEventListener("click", () => setPadHidden(false));
    document.addEventListener("keydown", (e) => {
      const tag = (e.target && e.target.tagName) || "";
      if (tag === "TEXTAREA" || tag === "INPUT") return;
      if (e.key === "Escape") { stepBack(); return; }
    });

    render();
  </script>
</body>
</html>
